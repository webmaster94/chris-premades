name: Release Creation

on: 
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ env.RELEASE_TAG }}
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
    # Install dependencies
    - run: npm ci
    - name: Run regression tests
      run: npm test
    - name: Build Compendiums
      run: npm run buildCompendiums
    - name: Webpack build
      run: npm run build

    # Remove the 'v' from the tag for versioning
    - id: get_version
      run: |
        echo "VERSION=${RELEASE_TAG#v}" >> $GITHUB_ENV
        echo "FOUNDRY_MANIFEST=https://github.com/${{github.repository}}/releases/latest/download/module.json" >> $GITHUB_ENV
        echo "FOUNDRY_DOWNLOAD=https://github.com/${{github.repository}}/releases/download/${RELEASE_TAG}/module.zip" >> $GITHUB_ENV

    # Generate module.json
    - id: generate_manifest
      run: |
        cat module-template.json > module.json

    #Substitute the Manifest and Download URLs in the module.json
    - name: Substitute Manifest and Download Links For Versioned Ones
      id: sub_manifest_link_version
      uses: restackio/update-json-file-action@2.1
      with:
        file: 'module.json'
        fields: "{\"version\": \"${{env.VERSION}}\", \"manifest\": \"${{env.FOUNDRY_MANIFEST}}\", \"download\": \"${{env.FOUNDRY_DOWNLOAD}}\"}"

    # create a zip file with all files required by the module to add to the release
    - run: zip -r ./module.zip module.json dist packs styles templates LICENSE lang images CHANGELOG.md README.md docs
    - name: Preserve published release notes
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > release-body.md
    # Create a release for this specific version
    - name: Update Release with Files
      id: create_version_release
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true # set this to false if you want to prevent updating existing releases
        name: ${{ github.event.release.name || inputs.release_tag }}
        draft: false
        prerelease: false
        token: ${{secrets.GITHUB_TOKEN}}
        artifacts: './module.json, ./module.zip'
        tag: ${{ env.RELEASE_TAG }}
        bodyFile: release-body.md
    - name: FoundryVTT AutoPublish
      if: ${{ github.repository_owner == 'chrisk123999' }}
      uses: fjogeleit/http-request-action@v2
      continue-on-error: true
      with:
        url: 'https://foundryvtt.com/_api/packages/release_version/'
        method: 'POST'
        customHeaders: '{"Content-Type": "application/json", "Authorization" : "${{ secrets.FOUNDRY_KEY }}"}'
        data: '{"dry_run": false, "id" : "chris-premades", "release": {"version" :  "${{env.VERSION}}", "manifest": "${{env.FOUNDRY_MANIFEST}}", "notes" : "https://github.com/${{github.repository}}/blob/release-v14/CHANGELOG.md", "compatibility" : {"minimum": "14", "verified": "14.360", "maximum": "14.999"} } }'
